name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The loop everybody lives in, and deliberately the first thing to report.
  # Needs no Android SDK and therefore no toolchain image, so a broken test is
  # known in a minute rather than after an image build.
  test:
    name: shared tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/cache@v6.1.0
        with:
          path: .cache/gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: make test

  # The same client against a real server. Unit tests prove it matches our idea
  # of one; this proves it matches the one it will actually talk to, which is
  # where a wrong assumption about the protocol shows up. Docker on an ubuntu
  # runner costs nothing, so this is free in both senses.
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/cache@v6.1.0
        with:
          path: .cache/gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: make conformance

  # The Android half, and the only job that needs the emulated-on-ARM toolchain
  # image. Built here natively on every change to how it is built.
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      # Gives `docker build` a buildx builder with the Actions cache backend
      # behind it, which is what makes BUILD_CACHE below mean anything.
      - uses: docker/setup-buildx-action@v4.4.0

      - uses: actions/cache@v6.1.0
        with:
          path: .cache/gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: make doctor

      - name: Build the toolchain image
        run: make toolchain BUILD_CACHE="--cache-from type=gha --cache-to type=gha,mode=max --load"

      - name: Build, signed with the key this repository keeps
        run: make gradle ARGS="assemble --stacktrace"
        env:
          # Absent on a fork, where the build falls back to a throwaway debug
          # key -- it still builds, its APK just will not install over ours.
          STRATUS_KEYSTORE_BASE64: ${{ secrets.STRATUS_KEYSTORE_BASE64 }}
          STRATUS_KEYSTORE_PASSWORD: ${{ secrets.STRATUS_KEYSTORE_PASSWORD }}

      # The only route onto a phone. A debug-signed APK sideloads with no
      # keystore, no Play account and no decision to make; release signing is a
      # separate question and only arrives the day this goes to somebody else.
      # `error` rather than a silent skip: an artifact nobody notices is missing
      # is worse than a failed build.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: stratus-app-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # The Android code, actually running. Until this existed CI compiled it and
  # nothing more, which for a cursor over MediaStore and a permission state is
  # the same as not testing it at all.
  device:
    name: android device tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.0

      - uses: actions/cache@v6.1.0
        with:
          path: .cache/gradle
          key: gradle-device-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-device-

      # The runner has KVM but not permission to use it, and an emulator without
      # it is too slow to finish inside any sensible timeout.
      - name: Let the emulator reach KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the toolchain image
        run: make toolchain BUILD_CACHE="--cache-from type=gha --cache-to type=gha,mode=max --load"

      - run: make device-test

      # Gradle reports a failed instrumented test as a path to an HTML file
      # inside a container nobody can open. The XML beside it has the reason.
      - name: What the device tests said
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("core/build/outputs/**/*.xml", recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  for problem in list(case.iter("failure")) + list(case.iter("error")):
                      print(f"== {case.get('classname')}.{case.get('name')}")
                      print((problem.text or problem.get("message") or "")[:1200])
          PY

  # iOS, and the reason this job exists before there is any iOS code: nothing
  # else ever links an Apple binary. A dependency published without an iOS
  # artifact configures and compiles happily on Linux and only fails here, so
  # without this the discovery would arrive months late.
  #
  # No Docker: the runner has none, and could not run the Apple toolchain if it
  # did. This is the one place the everything-through-a-container rule does not
  # hold, because nothing can make it hold.
  #
  # macos-latest is a standard runner and free on a public repository. A larger
  # label is charged for even here, so this must never grow one.
  ios:
    name: ios
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-macos-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-macos-

      - name: Run the shared tests on a simulator
        run: ./gradlew --no-daemon :core:iosSimulatorArm64Test

      - name: Link the framework Xcode embeds
        run: ./gradlew --no-daemon :ui:linkDebugFrameworkIosSimulatorArm64

      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate --spec iosApp/project.yml --project iosApp

      # Proves the framework is consumable from Swift, which linking it does
      # not: search paths, a static framework's symbols and the Kotlin runtime
      # all fail here rather than at link time.
      - name: Build the app for a simulator
        run: |
          xcodebuild build \
            -project iosApp/Stratus.xcodeproj \
            -scheme Stratus \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO | tail -40
