# Generated with XcodeGen rather than committed as a .pbxproj, and the reason is
# that nobody on this project has a Mac. A hand-maintained project file is worth
# its UUID soup only when somebody opens Xcode and edits it; here CI is the only
# consumer, so the source of truth may as well be readable.
name: Stratus
options:
  bundleIdPrefix: dev.stratus
  deploymentTarget:
    iOS: "15.0"

# The Cocoa half of crash reporting. The Kotlin SDK in the framework calls it
# and does not carry it -- a static framework links nothing -- so the app links
# it, at exactly the version that SDK release was built against (see
# gradle/libs.versions.toml).
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 8.58.2

targets:
  Stratus:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Stratus
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # What the shared keychain group is built from at runtime. A group has
        # to carry the team's prefix and only the build knows it, so each
        # process reads its own (see sharedKeychainGroup, stratus-app#105).
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        # Being woken to look at the camera roll (stratus-app#20). The system
        # refuses to register a handler for an identifier it was not told
        # about, and refuses the mode without the capability.
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - dev.stratus.backup
    settings:
      base:
        # The framework Gradle links, not one Xcode builds. Producing it is
        # :ui:linkDebugFrameworkIosSimulatorArm64, which CI runs first.
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../ui/build/bin/iosSimulatorArm64/debugFramework
        # There is no Apple Developer Program yet (see #5), so nothing here can
        # be signed. A simulator build does not need it.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - package: Sentry
      # Static, so it is linked and not embedded: there is no dynamic library to
      # carry into the bundle.
      - framework: ../ui/build/bin/iosSimulatorArm64/debugFramework/StratusUI.framework
        embed: false
      # The extension travels inside the app, which is what makes it appear
      # under Locations in Files.
      - target: StratusFileProvider

  # The library as a place to open from and save into (stratus-app#105).
  #
  # It links StratusCore and not StratusUI: that one carries Compose, and an
  # extension runs on a much shorter memory budget than an app. Two static
  # frameworks in two binaries, so there is nothing to collide.
  StratusFileProvider:
    type: app-extension
    platform: iOS
    sources:
      - FileProvider
    info:
      path: FileProvider/Info.plist
      properties:
        CFBundleDisplayName: Stratus
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          # Where materialised files live. It is an app group, so it needs an
          # entitlement a signed build has -- which is behind the developer
          # programme (stratus-app#5) and is why the device half of this is
          # deferred.
          NSExtensionFileProviderDocumentGroup: group.dev.stratus
          # Without this key Files does not show the provider at all.
          NSExtensionFileProviderSupportsEnumeration: true
    settings:
      base:
        # An extension's bundle id has to sit under the app's.
        PRODUCT_BUNDLE_IDENTIFIER: dev.stratus.Stratus.FileProvider
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../core/build/bin/iosSimulatorArm64/debugFramework
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - framework: ../core/build/bin/iosSimulatorArm64/debugFramework/StratusCore.framework
        embed: false
