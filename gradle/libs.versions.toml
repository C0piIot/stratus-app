[versions]
agp = "9.4.0"
kotlin = "2.4.20"
# Not 1.12: it requires compiling against API 37, and Google has published no
# android-37 platform yet -- only build-tools. Raise this when they do.
compose = "1.11.1"
ktor = "3.5.2"
coroutines = "1.11.0"
xmlutil = "1.0.2"
sqlite = "2.7.1"
activityCompose = "1.13.0"
lifecycleRuntime = "2.10.0"
# Not 1.19: it wants compileSdk 37, which Google has published build-tools for
# and no platform. Same wall as Compose above; raise both when it appears.
androidxCore = "1.18.0"
androidxMediarouter = "1.8.1"
playServicesCast = "22.3.1"
androidxTest = "1.7.0"
androidxWork = "2.11.0"
androidxTestJunit = "1.3.0"
androidxTestOrchestrator = "1.6.1"
androidxTestServices = "1.6.0"
uiautomator = "2.3.0"
# The androidx Compose that Compose Multiplatform 1.11 resolves to on Android;
# the test rule has to be the same one or it drives a UI it does not know.
composeUiTest = "1.11.2"
# The last stable one. 0.28 moves Apple to SwiftPM through a Gradle plugin of its
# own; this links Sentry Cocoa from the Xcode project instead, at the version
# below, which has to be the one this release was built against.
sentry = "0.27.0"
# The one Compose Multiplatform already resolves, named because App reads the
# lifecycle directly now; moving it apart from Compose's would be two copies.
lifecycleCompose = "2.9.6"
sentryCocoa = "8.58.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
xmlutil-core = { module = "io.github.pdvrieze.xmlutil:core", version.ref = "xmlutil" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
# Casting. The framework lives inside Play Services, so a phone without them
# gets the app minus the cast button -- decided in stratus-app#6. mediarouter is
# named here rather than taken transitively, because the device list is read
# from it directly.
play-services-cast = { module = "com.google.android.gms:play-services-cast-framework", version.ref = "playServicesCast" }
androidx-mediarouter = { module = "androidx.mediarouter:mediarouter", version.ref = "androidxMediarouter" }
androidx-work = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidxWork" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTest" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleCompose" }
sentry = { module = "io.sentry:sentry-kotlin-multiplatform", version.ref = "sentry" }
androidx-test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "androidxTestOrchestrator" }
androidx-test-services = { module = "androidx.test.services:test-services", version.ref = "androidxTestServices" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "composeUiTest" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "composeUiTest" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntime" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
